<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <!-- Makes Home Screen version behave more like an app -->
  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Copenhagen Celtic"
  >

  <meta
    name="theme-color"
    content="#064f32"
  >

  <!-- This will become the iPhone Home Screen icon -->
  <link
    rel="apple-touch-icon"
    href="celtic-icon.png"
  >

  <title>Copenhagen Celtic Membership</title>


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #ffffff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    body {
      min-height: 100vh;
      min-height: 100dvh;
    }


    .card {

      width: 100vw;

      min-height: 100vh;
      min-height: 100dvh;

      background: #ffffff;

      display: flex;
      flex-direction: column;

    }


    /* ============================
       HEADER
       ============================ */

    .header {

      background: #064f32;

      padding:
        max(18px, env(safe-area-inset-top))
        22px
        18px;

      display: flex;
      align-items: center;

      gap: 18px;

    }


    .badge {

      width: 92px;
      height: 92px;

      object-fit: contain;

      flex-shrink: 0;

    }


    .header-text {

      flex: 1;

    }


    .club-name {

      color: white;

      font-size: 29px;

      font-weight: 900;

      line-height: 1;

    }


    .membership-title {

      color: #c3a361;

      font-size: 12px;

      letter-spacing: 2px;

      margin-top: 9px;

    }


    /* ============================
       MAIN CARD
       ============================ */

    .content {

      flex: 1;

      padding:
        22px
        24px
        max(18px, env(safe-area-inset-bottom));

      display: flex;

      flex-direction: column;

      justify-content: space-between;

      text-align: center;

    }


    .member {

      display: flex;

      align-items: center;

      gap: 20px;

      text-align: left;

    }


    .photo {

      width: 110px;
      height: 110px;

      border-radius: 50%;

      object-fit: cover;

      object-position: center 25%;

      flex-shrink: 0;

      box-shadow:
        0 4px 14px
        rgba(0,0,0,.18);

    }


    .member-name {

      color: #064f32;

      font-size: 31px;

      font-weight: 900;

      line-height: 1.05;

    }


    .member-id {

      margin-top: 7px;

      color: #707772;

      font-size: 15px;

    }


    .active {

      display: inline-block;

      margin-top: 12px;

      padding:
        9px
        16px;

      border-radius: 999px;

      background: #08783e;

      color: white;

      font-size: 12px;

      font-weight: 900;

    }


    /* ============================
       DISCOUNT
       ============================ */

    .discount-section {

      padding: 17px 0;

      border-top:
        1px solid #dddddd;

      border-bottom:
        1px solid #dddddd;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 24px;

    }


    .discount-number {

      color: #064f32;

      font-size: 48px;

      line-height: 1;

      font-weight: 900;

    }


    .discount-text {

      margin-top: 6px;

      color: #064f32;

      font-size: 11px;

      font-weight: 900;

    }


    .divider {

      width: 1px;
      height: 70px;

      background: #dddddd;

    }


    .jeffery {

      width: 170px;

      max-height: 85px;

      object-fit: contain;

    }


    /* ============================
       QR
       ============================ */

    .qr-title {

      color: #064f32;

      font-size: 13px;

      font-weight: 900;

      letter-spacing: 1px;

      margin-bottom: 8px;

    }


    .qr {

      width: min(58vw, 240px);

      height: auto;

    }


    .qr-description {

      margin-top: 5px;

      color: #707772;

      font-size: 11px;

    }


    /* ============================
       LIVE SECURITY
       ============================ */

    .security {

      padding: 10px;

      background: #f3fbf6;

      border:
        1px solid #b7d9c6;

      border-radius: 10px;

      color: #08783e;

      font-size: 11px;

      font-weight: 900;

    }


    .pulse {

      display: inline-block;

      width: 8px;
      height: 8px;

      margin-right: 5px;

      border-radius: 50%;

      background: #12a35c;

      animation:
        pulse
        1.2s
        infinite;

    }


    @keyframes pulse {

      0% {
        opacity: .35;
        transform: scale(.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.3);
      }

      100% {
        opacity: .35;
        transform: scale(.8);
      }

    }


    #clock {

      margin-top: 5px;

      font-size: 16px;

    }


    .moving-line {

      height: 4px;

      margin-top: 8px;

      border-radius: 10px;

      background:
        linear-gradient(
          90deg,
          #08783e,
          #c4ffda,
          #08783e
        );

      background-size:
        200% 100%;

      animation:
        moving
        1.8s
        linear
        infinite;

    }


    @keyframes moving {

      from {
        background-position: 200% 0;
      }

      to {
        background-position: -200% 0;
      }

    }


    .expiry {

      color: #656e69;

      font-size: 12px;

    }


    /* Smaller iPhones */

    @media (max-height: 750px) {

      .badge {
        width: 75px;
        height: 75px;
      }

      .header {
        padding-bottom: 12px;
      }

      .club-name {
        font-size: 25px;
      }

      .photo {
        width: 90px;
        height: 90px;
      }

      .member-name {
        font-size: 27px;
      }

      .qr {
        width: 190px;
      }

      .content {
        padding-top: 14px;
      }

    }

  </style>

</head>


<body>


  <div class="card">


    <div class="header">


      <img
        class="badge"
        src="celtic-icon.png"
        alt="Copenhagen Celtic"
      >


      <div class="header-text">


        <div class="club-name">

          COPENHAGEN CELTIC

        </div>


        <div class="membership-title">

          OFFICIAL MEMBERSHIP

        </div>


      </div>


    </div>


    <div class="content">


      <div>


        <div class="member">


          <!--
          We will replace this with your actual
          member photo in the next step.
          -->

          <img
            class="photo"
            src="member-photo.jpg"
            alt="Member photo"
          >


          <div>


            <div class="member-name">

              OLI DOBSON

            </div>


            <div class="member-id">

              CC-001

            </div>


          </div>


        </div>


        <div class="active">

          ● ACTIVE MEMBER

        </div>


      </div>


      <div class="discount-section">


        <div>


          <div class="discount-number">

            15%

          </div>


          <div class="discount-text">

            MEMBER DISCOUNT

          </div>


        </div>


        <div class="divider">

        </div>


        <img
          class="jeffery"
          src="jeffery-logo.png"
          alt="The Jeffery Public House"
        >


      </div>


      <div>


        <div class="qr-title">

          SCAN TO VERIFY MEMBERSHIP

        </div>


        <img
          class="qr"
          src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=10&data=https%3A%2F%2Fscript.google.com%2Fmacros%2Fs%2FAKfycbzJ3DIzgru3loxs53Dcj8P0rDOQjx4IgTxJ9VzvbNx5DWjYe3rGBDgYvJ9Bgs5b0gBY%2Fexec%3Fid%3DCC-001"
          alt="Membership verification QR code"
        >


        <div class="qr-description">

          Bar staff scan using a normal phone camera

        </div>


      </div>


      <div class="security">


        <span class="pulse">

        </span>


        LIVE MEMBERSHIP CARD


        <div id="clock">

        </div>


        <div class="moving-line">

        </div>


      </div>


      <div class="expiry">

        Valid until

        <strong>

          31 August 2027

        </strong>

      </div>


    </div>


  </div>


  <script>


    function updateClock() {


      const now =
        new Date();


      document
        .getElementById("clock")
        .textContent =
          now.toLocaleTimeString(
            "en-GB",
            {
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit"
            }
          );


    }


    updateClock();


    setInterval(
      updateClock,
      1000
    );


  </script>


</body>


</html>
