<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Copenhagen Celtic"
  >

  <meta
    name="theme-color"
    content="#064f32"
  >

  <!-- iPhone Home Screen icon -->
  <link
    rel="apple-touch-icon"
    href="Celtic%20Badge.png"
  >

  <title>Copenhagen Celtic Membership</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #ffffff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      overflow: hidden;
    }


    body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }


    /* ========================================
       COMPLETE MEMBERSHIP CARD
       ======================================== */

    .card {

      width: 100vw;

      height: 100vh;
      height: 100dvh;

      background: #ffffff;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }


    /* ========================================
       HEADER
       ======================================== */

    .header {

      flex: 0 0 auto;

      min-height: 145px;

      background: #064f32;

      padding:
        max(12px, env(safe-area-inset-top))
        18px
        14px;

      display: flex;
      align-items: center;

      gap: 17px;
    }


    .badge {

      width: 94px;
      height: 94px;

      object-fit: contain;

      flex-shrink: 0;
    }


    .header-text {

      flex: 1;

      text-align: center;

      padding-right: 8px;
    }


    .club-name {

      color: #ffffff;

      font-size: clamp(27px, 7vw, 38px);

      font-weight: 900;

      line-height: 1.02;

      letter-spacing: .3px;
    }


    .membership-title {

      margin-top: 10px;

      color: #c3a361;

      font-size: clamp(10px, 2.7vw, 14px);

      font-weight: 700;

      letter-spacing: 2px;
    }


    .title-line {

      width: 125px;

      height: 2px;

      margin:
        10px auto
        0;

      background: #c3a361;
    }


    /* ========================================
       MAIN CONTENT
       ======================================== */

    .content {

      flex: 1;

      min-height: 0;

      padding:
        12px
        22px
        max(10px, env(safe-area-inset-bottom));

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: space-between;

      text-align: center;
    }


    /* ========================================
       LARGE MEMBER PHOTO
       ======================================== */

    .photo-wrap {

      flex: 0 0 auto;

      margin-top: -4px;
    }


    .photo {

      width: clamp(150px, 40vw, 195px);

      height: clamp(150px, 40vw, 195px);

      border-radius: 50%;

      object-fit: cover;

      object-position: center 25%;

      display: block;

      border: 5px solid #ffffff;

      background: #eeeeee;

      box-shadow:
        0 5px 18px
        rgba(0,0,0,.18);
    }


    /* ========================================
       MEMBER DETAILS
       ======================================== */

    .member-name {

      margin-top: 7px;

      color: #064f32;

      font-size: clamp(29px, 8vw, 40px);

      font-weight: 900;

      line-height: 1;
    }


    .member-id {

      margin-top: 4px;

      color: #707772;

      font-size: clamp(14px, 4vw, 18px);
    }


    /* ========================================
       ACTIVE MEMBER BAR
       ======================================== */

    .active {

      width: 100%;

      max-width: 390px;

      margin-top: 7px;

      padding:
        11px
        15px;

      border-radius: 11px;

      background: #08783e;

      color: #ffffff;

      font-size: clamp(14px, 4vw, 18px);

      font-weight: 900;

      letter-spacing: .2px;

      box-shadow:
        0 2px 7px
        rgba(0,0,0,.10);
    }


    /* ========================================
       LIVE MEMBERSHIP CARD
       ======================================== */

    .security {

      width: 100%;

      max-width: 390px;

      padding:
        11px
        13px;

      background: #f3fbf6;

      border:
        2px solid #08783e;

      border-radius: 11px;

      color: #08783e;

      font-size: 12px;

      font-weight: 900;

      letter-spacing: .7px;
    }


    .live-title {

      display: flex;

      align-items: center;

      justify-content: center;
    }


    .pulse {

      display: inline-block;

      width: 10px;
      height: 10px;

      margin-right: 7px;

      border-radius: 50%;

      background: #12a35c;

      animation:
        pulse
        1.2s
        infinite;
    }


    @keyframes pulse {

      0% {
        opacity: .35;
        transform: scale(.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.3);
      }

      100% {
        opacity: .35;
        transform: scale(.8);
      }
    }


    #clock {

      margin-top: 5px;

      color: #17231d;

      font-size: clamp(19px, 5.3vw, 25px);

      font-weight: 900;
    }


    #date {

      margin-top: 2px;

      color: #555555;

      font-size: 10px;

      font-weight: 400;
    }


    .moving-line {

      height: 4px;

      margin-top: 7px;

      border-radius: 10px;

      background:
        linear-gradient(
          90deg,
          #08783e,
          #c4ffda,
          #08783e
        );

      background-size: 200% 100%;

      animation:
        moving
        1.8s
        linear
        infinite;
    }


    @keyframes moving {

      from {
        background-position: 200% 0;
      }

      to {
        background-position: -200% 0;
      }
    }


    /* ========================================
       DISCOUNT + JEFFERY
       ======================================== */

    .discount-section {

      width: 100%;

      max-width: 400px;

      padding:
        9px
        0;

      border-top:
        1px solid #e0e0e0;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 24px;
    }


    .discount {

      min-width: 105px;
    }


    .discount-number {

      color: #064f32;

      font-size: clamp(42px, 11vw, 56px);

      line-height: .9;

      font-weight: 900;
    }


    .discount-text {

      margin-top: 6px;

      color: #064f32;

      font-size: 10px;

      font-weight: 900;
    }


    .divider {

      width: 1px;

      height: 65px;

      background: #dddddd;
    }


    .jeffery {

      width: 155px;

      max-width: 42vw;

      height: 78px;

      object-fit: contain;
    }


    /* ========================================
       EXPIRY
       ======================================== */

    .expiry-box {

      width: 100%;

      max-width: 400px;

      padding:
        9px
        10px;

      border:
        1px solid #e3e3e3;

      border-radius: 10px;

      background: #fafafa;

      color: #202020;

      font-size: 12px;
    }


    .expiry-box strong {

      font-size: 13px;
    }


    /* ========================================
       SHORTER IPHONES
       ======================================== */

    @media (max-height: 780px) {

      .header {

        min-height: 118px;

        padding-top:
          max(
            8px,
            env(safe-area-inset-top)
          );

        padding-bottom: 8px;
      }


      .badge {

        width: 76px;
        height: 76px;
      }


      .club-name {

        font-size: 27px;
      }


      .membership-title {

        margin-top: 6px;

        font-size: 10px;
      }


      .title-line {

        margin-top: 6px;

        width: 95px;
      }


      .content {

        padding-top: 7px;

        padding-bottom:
          max(
            6px,
            env(safe-area-inset-bottom)
          );
      }


      .photo {

        width: 135px;
        height: 135px;
      }


      .member-name {

        margin-top: 4px;

        font-size: 28px;
      }


      .member-id {

        font-size: 13px;
      }


      .active {

        margin-top: 4px;

        padding:
          8px
          12px;

        font-size: 13px;
      }


      .security {

        padding:
          7px
          10px;
      }


      #clock {

        margin-top: 3px;

        font-size: 18px;
      }


      .moving-line {

        margin-top: 4px;
      }


      .discount-section {

        padding:
          4px
          0;
      }


      .discount-number {

        font-size: 40px;
      }


      .divider {

        height: 50px;
      }


      .jeffery {

        height: 57px;
      }


      .expiry-box {

        padding:
          6px
          8px;

        font-size: 10px;
      }


      .expiry-box strong {

        font-size: 11px;
      }

    }


    /* ========================================
       VERY SHORT SCREENS
       ======================================== */

    @media (max-height: 680px) {

      .header {

        min-height: 100px;
      }


      .badge {

        width: 65px;
        height: 65px;
      }


      .club-name {

        font-size: 23px;
      }


      .photo {

        width: 115px;
        height: 115px;
      }


      .member-name {

        font-size: 25px;
      }


      .security {

        font-size: 10px;
      }


      #clock {

        font-size: 16px;
      }


      .discount-number {

        font-size: 34px;
      }


      .discount-section {

        gap: 16px;
      }


      .jeffery {

        height: 48px;
      }

    }


  </style>

</head>


<body>


  <div class="card">


    <!-- HEADER -->

    <div class="header">


      <img
        class="badge"
        src="Celtic%20Badge.png"
        alt="Copenhagen Celtic"
      >


      <div class="header-text">


        <div class="club-name">

          COPENHAGEN CELTIC

        </div>


        <div class="membership-title">

          OFFICIAL MEMBERSHIP

        </div>


        <div class="title-line">

        </div>


      </div>


    </div>


    <!-- CONTENT -->

    <div class="content">


      <!-- LARGE MEMBER PHOTO -->

      <div class="photo-wrap">


        <img
          class="photo"
          src="Dobs%20image.jpeg"
          alt="Member photo"
        >


        <div class="member-name">

          OLI DOBSON

        </div>


        <div class="member-id">

          CC-001

        </div>


        <div class="active">

          ✓ ACTIVE MEMBER

        </div>


      </div>


      <!-- LIVE MEMBERSHIP CARD -->

      <div class="security">


        <div class="live-title">


          <span class="pulse">

          </span>


          LIVE MEMBERSHIP CARD


        </div>


        <div id="clock">

        </div>


        <div id="date">

        </div>


        <div class="moving-line">

        </div>


      </div>


      <!-- DISCOUNT -->

      <div class="discount-section">


        <div class="discount">


          <div class="discount-number">

            15%

          </div>


          <div class="discount-text">

            MEMBER DISCOUNT

          </div>


        </div>


        <div class="divider">

        </div>


        <img
          class="jeffery"
          src="jeffery-logo.jpeg"
          alt="The Jeffery Public House"
        >


      </div>


      <!-- VALID UNTIL -->

      <div class="expiry-box">

        Valid until

        <strong>

          31 August 2027

        </strong>

      </div>


    </div>


  </div>


  <script>


    function updateClock() {


      const now =
        new Date();


      const clock =
        document.getElementById(
          "clock"
        );


      const date =
        document.getElementById(
          "date"
        );


      if (clock) {

        clock.textContent =
          now.toLocaleTimeString(
            "en-GB",
            {
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit"
            }
          );

      }


      if (date) {

        date.textContent =
          now.toLocaleDateString(
            "en-GB",
            {
              weekday: "long",
              day: "numeric",
              month: "long",
              year: "numeric"
            }
          );

      }


    }


    updateClock();


    setInterval(
      updateClock,
      1000
    );


  </script>


</body>

</html>
