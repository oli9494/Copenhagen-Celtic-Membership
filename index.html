<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Copenhagen Celtic"
  >

  <meta
    name="theme-color"
    content="#064f32"
  >

  <link
    rel="apple-touch-icon"
    href="Celtic%20Badge.png"
  >

  <title>Copenhagen Celtic Membership</title>


  <style>

    * {
      box-sizing:border-box;
    }


    html,
    body {

      margin:0;

      padding:0;

      width:100%;

      height:100%;

      background:#ffffff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }


    body {

      min-height:100vh;

      min-height:100dvh;

    }


    .card {

      width:100%;

      min-height:100vh;

      min-height:100dvh;

      display:flex;

      flex-direction:column;

      background:white;

    }


    /* =====================================
       HEADER
       ===================================== */


    .header {

      background:#064f32;

      padding:
        max(12px, env(safe-area-inset-top))
        18px
        14px;

      display:flex;

      align-items:center;

      gap:17px;

    }


    .badge {

      width:94px;

      height:94px;

      object-fit:contain;

      flex-shrink:0;

    }


    .header-text {

      flex:1;

      text-align:center;

      padding-right:8px;

    }


    .club-name {

      color:white;

      font-size:34px;

      font-weight:900;

      line-height:1;

    }


    .membership-title {

      margin-top:9px;

      color:#c3a361;

      font-size:12px;

      font-weight:700;

      letter-spacing:2px;

    }


    .title-line {

      width:125px;

      height:2px;

      margin:
        9px auto
        0;

      background:#c3a361;

    }


    /* =====================================
       CONTENT
       ===================================== */


    .content {

      flex:1;

      padding:
        12px
        22px
        max(10px, env(safe-area-inset-bottom));

      display:flex;

      flex-direction:column;

      align-items:center;

      justify-content:space-between;

      gap:8px;

      text-align:center;

    }


    /* =====================================
       LARGE PHOTO
       ===================================== */


    .photo-wrap {

      width:100%;

      display:flex;

      flex-direction:column;

      align-items:center;

      justify-content:center;

    }


    .photo {

      width:min(68vw, 300px);

      height:min(68vw, 300px);

      border-radius:50%;

      object-fit:cover;

      object-position:center 25%;

      display:block;

      margin:0 auto;

      border:
        5px solid
        white;

      background:#eeeeee;

      box-shadow:
        0 5px 18px
        rgba(0,0,0,.18);

    }


    .member-name {

      margin-top:7px;

      color:#064f32;

      font-size:36px;

      font-weight:900;

      line-height:1;

    }


    .member-id {

      margin-top:5px;

      color:#707772;

      font-size:16px;

    }


    /* =====================================
       STATUS
       ===================================== */


    .status {

      width:100%;

      max-width:400px;

      margin-top:7px;

      padding:
        11px
        15px;

      border-radius:11px;

      background:#08783e;

      color:white;

      font-size:17px;

      font-weight:900;

    }


    .status.inactive {

      background:#b91c1c;

    }


    /* =====================================
       LIVE MEMBERSHIP CARD
       ===================================== */


    .security {

      width:100%;

      max-width:400px;

      padding:
        13px
        14px;

      background:#f3fbf6;

      border:
        2px solid
        #08783e;

      border-radius:11px;

      color:#08783e;

      font-size:13px;

      font-weight:900;

      letter-spacing:.7px;

    }


    .security.inactive {

      border-color:#b91c1c;

      color:#b91c1c;

      background:#fff5f5;

    }


    .pulse {

      display:inline-block;

      width:10px;

      height:10px;

      margin-right:7px;

      border-radius:50%;

      background:#12a35c;

      animation:
        pulse
        1.2s
        infinite;

    }


    @keyframes pulse {

      0% {
        opacity:.35;
        transform:scale(.8);
      }

      50% {
        opacity:1;
        transform:scale(1.3);
      }

      100% {
        opacity:.35;
        transform:scale(.8);
      }

    }


    #clock {

      margin-top:5px;

      color:#17231d;

      font-size:24px;

      font-weight:900;

    }


    #date {

      margin-top:2px;

      color:#555;

      font-size:11px;

      font-weight:400;

    }


    .moving-line {

      height:4px;

      margin-top:7px;

      border-radius:10px;

      background:
        linear-gradient(
          90deg,
          #08783e,
          #c4ffda,
          #08783e
        );

      background-size:
        200% 100%;

      animation:
        moving
        1.8s
        linear
        infinite;

    }


    @keyframes moving {

      from {
        background-position:200% 0;
      }

      to {
        background-position:-200% 0;
      }

    }


    /* =====================================
       DISCOUNT
       ===================================== */


    .discount-section {

      width:100%;

      max-width:400px;

      padding:
        9px
        0;

      border-top:
        1px solid
        #e0e0e0;

      display:flex;

      align-items:center;

      justify-content:center;

      gap:24px;

    }


    .discount-number {

      color:#064f32;

      font-size:52px;

      line-height:.9;

      font-weight:900;

    }


    .discount-text {

      margin-top:6px;

      color:#064f32;

      font-size:10px;

      font-weight:900;

    }


    .divider {

      width:1px;

      height:65px;

      background:#dddddd;

    }


    .jeffery {

      width:155px;

      max-width:42vw;

      height:78px;

      object-fit:contain;

    }


    /* =====================================
       EXPIRY
       ===================================== */


    .expiry {

      width:100%;

      max-width:400px;

      padding:
        9px
        10px;

      border:
        1px solid
        #e3e3e3;

      border-radius:10px;

      background:#fafafa;

      color:#202020;

      font-size:12px;

    }


    /* =====================================
       LOADING
       ===================================== */


    .loading {

      position:fixed;

      inset:0;

      display:flex;

      align-items:center;

      justify-content:center;

      background:white;

      z-index:99;

      color:#064f32;

      font-size:18px;

      font-weight:bold;

    }


    /* =====================================
       SHORTER IPHONES
       ===================================== */


    @media (max-height:760px) {

      .header {

        padding-top:
          max(
            8px,
            env(safe-area-inset-top)
          );

        padding-bottom:8px;

      }


      .badge {

        width:72px;

        height:72px;

      }


      .club-name {

        font-size:27px;

      }


      .membership-title {

        margin-top:5px;

        font-size:10px;

      }


      .photo {

        width:210px;

        height:210px;

      }


      .member-name {

        font-size:29px;

      }


      .status {

        padding:
          8px
          12px;

        font-size:14px;

      }


      .security {

        padding:
          8px
          10px;

      }


      #clock {

        font-size:19px;

      }


      .discount-number {

        font-size:40px;

      }


      .jeffery {

        height:58px;

      }

    }


  </style>

</head>


<body>


  <div
    id="loading"
    class="loading"
  >

    Loading membership...

  </div>


  <div
    id="card"
    class="card"
    style="display:none;"
  >


    <div class="header">


      <img
        class="badge"
        src="Celtic%20Badge.png"
        alt="Copenhagen Celtic"
      >


      <div class="header-text">


        <div class="club-name">

          COPENHAGEN CELTIC

        </div>


        <div class="membership-title">

          OFFICIAL MEMBERSHIP

        </div>


        <div class="title-line">

        </div>


      </div>


    </div>


    <div class="content">


      <div class="photo-wrap">


        <img
          id="memberPhoto"
          class="photo"
          alt="Member photo"
        >


        <div
          id="memberName"
          class="member-name"
        >

        </div>


        <div
          id="memberID"
          class="member-id"
        >

        </div>


        <div
          id="status"
          class="status"
        >

        </div>


      </div>


      <div
        id="security"
        class="security"
      >


        <span
          id="pulse"
          class="pulse"
        >

        </span>


        <span id="liveText">

          LIVE MEMBERSHIP CARD

        </span>


        <div id="clock">

        </div>


        <div id="date">

        </div>


        <div
          id="movingLine"
          class="moving-line"
        >

        </div>


      </div>


      <div class="discount-section">


        <div>


          <div class="discount-number">

            15%

          </div>


          <div class="discount-text">

            MEMBER DISCOUNT

          </div>


        </div>


        <div class="divider">

        </div>


        <img
          class="jeffery"
          src="jeffery-logo.jpeg"
          alt="The Jeffery Public House"
        >


      </div>


      <div class="expiry">

        Valid until

        <strong id="expiry">

        </strong>

      </div>


    </div>


  </div>


  <script>


    const API_URL =
  "https://script.google.com/macros/s/AKfycbz1KHKFgZJdlIO7cY_Pwwf0etYpOWGb-ZGXVC38AbzjP4rPLaFc1ymfWxs99u3AU3at/exec";


    const params =
      new URLSearchParams(
        window.location.search
      );


    const memberID =
      (
        params.get("id") ||
        "CC-001"
      )
      .trim()
      .toUpperCase();


    // ========================================
    // APPS SCRIPT CALLS THIS FUNCTION
    // ========================================


    function loadMember(data) {


      const loading =
        document.getElementById(
          "loading"
        );


      if (
        !data ||
        !data.found
      ) {


        loading.textContent =
          "Membership not found.";


        return;


      }


      document
        .getElementById(
          "memberName"
        )
        .textContent =
          data.name;


      document
        .getElementById(
          "memberID"
        )
        .textContent =
          data.id;


      document
        .getElementById(
          "expiry"
        )
        .textContent =
          data.expiry;


      const photo =
        document.getElementById(
          "memberPhoto"
        );


      photo.src =
        data.photo;


      const status =
        document.getElementById(
          "status"
        );


      const security =
        document.getElementById(
          "security"
        );


      const pulse =
        document.getElementById(
          "pulse"
        );


      const movingLine =
        document.getElementById(
          "movingLine"
        );


      if (data.active) {


        status.textContent =
          "✓ ACTIVE MEMBER";


      } else {


        status.textContent =
          "✕ INACTIVE MEMBER";


        status.classList.add(
          "inactive"
        );


        security.classList.add(
          "inactive"
        );


        pulse.style.display =
          "none";


        movingLine.style.display =
          "none";


        document
          .getElementById(
            "liveText"
          )
          .textContent =
            "MEMBERSHIP INACTIVE";


      }


      loading.style.display =
        "none";


      document
        .getElementById(
          "card"
        )
        .style.display =
          "flex";


    }


    // ========================================
    // LOAD MEMBER FROM GOOGLE SHEET
    // ========================================


    const script =
      document.createElement(
        "script"
      );


    script.src =
      API_URL +
      "?api=1&id=" +
      encodeURIComponent(
        memberID
      ) +
      "&callback=loadMember";


    document.body.appendChild(
      script
    );


    // ========================================
    // LIVE CLOCK
    // ========================================


    function updateClock() {


      const now =
        new Date();


      document
        .getElementById(
          "clock"
        )
        .textContent =
          now.toLocaleTimeString(
            "en-GB",
            {
              hour:"2-digit",
              minute:"2-digit",
              second:"2-digit"
            }
          );


      document
        .getElementById(
          "date"
        )
        .textContent =
          now.toLocaleDateString(
            "en-GB",
            {
              weekday:"long",
              day:"numeric",
              month:"long",
              year:"numeric"
            }
          );


    }


    updateClock();


    setInterval(
      updateClock,
      1000
    );


  </script>


</body>

</html>
