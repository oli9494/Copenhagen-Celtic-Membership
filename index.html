<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <!-- iPhone Home Screen / App settings -->
  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Copenhagen Celtic"
  >

  <meta
    name="theme-color"
    content="#064f32"
  >

  <!-- EXACT COPENHAGEN CELTIC BADGE -->
  <!-- This is also used as the iPhone Home Screen icon -->
  <link
    rel="apple-touch-icon"
    href="Celtic%20Badge.png"
  >

  <title>Copenhagen Celtic Membership</title>


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #ffffff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      overflow: hidden;

    }

    body {

      width: 100vw;

      height: 100vh;
      height: 100dvh;

    }


    /* ========================================
       COMPLETE MEMBERSHIP CARD
       ======================================== */

    .card {

      width: 100vw;

      height: 100vh;
      height: 100dvh;

      background: #ffffff;

      display: flex;
      flex-direction: column;

      overflow: hidden;

    }


    /* ========================================
       HEADER
       ======================================== */

    .header {

      flex: 0 0 auto;

      background: #064f32;

      padding:
        max(10px, env(safe-area-inset-top))
        18px
        10px;

      display: flex;

      align-items: center;

      gap: 14px;

    }

    .badge {

      width: 68px;
      height: 68px;

      object-fit: contain;

      flex-shrink: 0;

    }

    .header-text {

      flex: 1;

      text-align: left;

    }

    .club-name {

      color: #ffffff;

      font-size: 25px;

      font-weight: 900;

      line-height: 1;

      letter-spacing: .2px;

    }

    .membership-title {

      color: #c3a361;

      font-size: 10px;

      font-weight: 700;

      letter-spacing: 1.8px;

      margin-top: 7px;

    }


    /* ========================================
       MAIN BODY
       ======================================== */

    .content {

      flex: 1;

      min-height: 0;

      padding:
        12px
        20px
        max(9px, env(safe-area-inset-bottom));

      display: flex;

      flex-direction: column;

      justify-content: space-between;

      text-align: center;

      gap: 7px;

    }


    /* ========================================
       MEMBER DETAILS
       ======================================== */

    .member-area {

      flex: 0 0 auto;

    }

    .member {

      display: flex;

      align-items: center;

      gap: 15px;

      text-align: left;

    }

    .photo {

      width: 82px;
      height: 82px;

      border-radius: 50%;

      object-fit: cover;

      object-position: center 25%;

      flex-shrink: 0;

      background: #eeeeee;

      box-shadow:
        0 3px 10px
        rgba(0,0,0,.16);

    }

    .member-details {

      flex: 1;

      min-width: 0;

    }

    .member-name {

      color: #064f32;

      font-size: 26px;

      font-weight: 900;

      line-height: 1.05;

    }

    .member-id {

      margin-top: 5px;

      color: #707772;

      font-size: 13px;

    }

    .active {

      display: inline-block;

      margin-top: 8px;

      padding:
        7px
        13px;

      border-radius: 999px;

      background: #08783e;

      color: #ffffff;

      font-size: 10px;

      font-weight: 900;

      letter-spacing: .3px;

    }


    /* ========================================
       DISCOUNT / JEFFERY
       ======================================== */

    .discount-section {

      flex: 0 0 auto;

      padding: 9px 0;

      border-top:
        1px solid #e0e0e0;

      border-bottom:
        1px solid #e0e0e0;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 20px;

    }

    .discount {

      min-width: 90px;

    }

    .discount-number {

      color: #064f32;

      font-size: 37px;

      line-height: 1;

      font-weight: 900;

    }

    .discount-text {

      margin-top: 4px;

      color: #064f32;

      font-size: 9px;

      font-weight: 900;

      letter-spacing: .3px;

    }

    .divider {

      width: 1px;

      height: 52px;

      background: #dddddd;

    }

    .jeffery {

      width: 135px;

      max-width: 38vw;

      height: 60px;

      object-fit: contain;

    }


    /* ========================================
       QR CODE
       ======================================== */

    .qr-section {

      flex: 0 0 auto;

      text-align: center;

    }

    .qr-title {

      color: #064f32;

      font-size: 10px;

      font-weight: 900;

      letter-spacing: .9px;

      margin-bottom: 5px;

    }

    .qr {

      display: block;

      width: 170px;
      height: 170px;

      max-height: 24vh;

      max-width: 45vw;

      object-fit: contain;

      margin: 0 auto;

      background: white;

    }

    .qr-description {

      margin-top: 3px;

      color: #707772;

      font-size: 9px;

    }


    /* ========================================
       LIVE SECURITY
       ======================================== */

    .security {

      flex: 0 0 auto;

      padding:
        7px
        10px;

      background: #f3fbf6;

      border:
        1px solid #b7d9c6;

      border-radius: 8px;

      color: #08783e;

      font-size: 9px;

      font-weight: 900;

      letter-spacing: .3px;

    }

    .pulse {

      display: inline-block;

      width: 7px;
      height: 7px;

      margin-right: 4px;

      border-radius: 50%;

      background: #12a35c;

      animation:
        pulse
        1.2s
        infinite;

    }

    @keyframes pulse {

      0% {

        opacity: .35;

        transform:
          scale(.8);

      }

      50% {

        opacity: 1;

        transform:
          scale(1.3);

      }

      100% {

        opacity: .35;

        transform:
          scale(.8);

      }

    }

    #clock {

      margin-top: 3px;

      font-size: 13px;

      font-weight: 900;

    }

    .moving-line {

      height: 3px;

      margin-top: 5px;

      border-radius: 10px;

      background:
        linear-gradient(
          90deg,
          #08783e,
          #c4ffda,
          #08783e
        );

      background-size:
        200% 100%;

      animation:
        moving
        1.8s
        linear
        infinite;

    }

    @keyframes moving {

      from {

        background-position:
          200% 0;

      }

      to {

        background-position:
          -200% 0;

      }

    }


    /* ========================================
       EXPIRY
       ======================================== */

    .expiry {

      flex: 0 0 auto;

      color: #656e69;

      font-size: 10px;

    }


    /* ========================================
       SMALLER IPHONES
       ======================================== */

    @media (max-height: 750px) {

      .header {

        padding-top:
          max(
            7px,
            env(safe-area-inset-top)
          );

        padding-bottom: 7px;

      }

      .badge {

        width: 58px;
        height: 58px;

      }

      .club-name {

        font-size: 22px;

      }

      .membership-title {

        font-size: 9px;

        margin-top: 5px;

      }

      .content {

        padding-top: 8px;

        padding-bottom:
          max(
            6px,
            env(safe-area-inset-bottom)
          );

        gap: 4px;

      }

      .photo {

        width: 70px;
        height: 70px;

      }

      .member-name {

        font-size: 23px;

      }

      .active {

        margin-top: 5px;

        padding:
          5px
          11px;

      }

      .discount-section {

        padding:
          5px
          0;

      }

      .discount-number {

        font-size: 32px;

      }

      .divider {

        height: 44px;

      }

      .jeffery {

        height: 48px;

      }

      .qr {

        width: 145px;
        height: 145px;

      }

      .security {

        padding: 5px 8px;

      }

    }

  </style>

</head>


<body>


  <div class="card">


    <!-- =====================================
         HEADER
         ===================================== -->

    <div class="header">


      <!-- NEW BADGE FILE -->
      <img
        class="badge"
        src="Celtic%20Badge.png"
        alt="Copenhagen Celtic"
      >


      <div class="header-text">


        <div class="club-name">

          COPENHAGEN CELTIC

        </div>


        <div class="membership-title">

          OFFICIAL MEMBERSHIP

        </div>


      </div>


    </div>


    <!-- =====================================
         CONTENT
         ===================================== -->

    <div class="content">


      <!-- MEMBER -->

      <div class="member-area">


        <div class="member">


          <img
            class="photo"
            src="member-photo.jpeg"
            alt="Member photo"
          >


          <div class="member-details">


            <div class="member-name">

              OLI DOBSON

            </div>


            <div class="member-id">

              CC-001

            </div>


            <div class="active">

              ● ACTIVE MEMBER

            </div>


          </div>


        </div>


      </div>


      <!-- DISCOUNT -->

      <div class="discount-section">


        <div class="discount">


          <div class="discount-number">

            15%

          </div>


          <div class="discount-text">

            MEMBER DISCOUNT

          </div>


        </div>


        <div class="divider">

        </div>


        <img
          class="jeffery"
          src="jeffery-logo.jpeg"
          alt="The Jeffery Public House"
        >


      </div>


      <!-- QR -->

      <div class="qr-section">


        <div class="qr-title">

          SCAN TO VERIFY MEMBERSHIP

        </div>


        <img
          class="qr"
          src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=10&data=https%3A%2F%2Fscript.google.com%2Fmacros%2Fs%2FAKfycbzJ3DIzgru3loxs53Dcj8P0rDOQjx4IgTxJ9VzvbNx5DWjYe3rGBDgYvJ9Bgs5b0gBY%2Fexec%3Fid%3DCC-001"
          alt="Membership verification QR code"
        >


        <div class="qr-description">

          Bar staff scan using a normal phone camera

        </div>


      </div>


      <!-- LIVE SECURITY -->

      <div class="security">


        <span class="pulse">

        </span>


        LIVE MEMBERSHIP CARD


        <div id="clock">

        </div>


        <div class="moving-line">

        </div>


      </div>


      <!-- EXPIRY -->

      <div class="expiry">

        Valid until

        <strong>

          31 August 2027

        </strong>

      </div>


    </div>


  </div>


  <!-- =====================================
       LIVE CLOCK
       ===================================== -->

  <script>


    function updateClock() {


      const now =
        new Date();


      const clock =
        document.getElementById(
          "clock"
        );


      if (clock) {


        clock.textContent =
          now.toLocaleTimeString(
            "en-GB",
            {
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit"
            }
          );


      }


    }


    updateClock();


    setInterval(
      updateClock,
      1000
    );


  </script>


</body>

</html>
